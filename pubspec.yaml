name: flutter_demo
description: Flutter techs demonstration app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ^3.29.0

dependencies:
  flutter:
    sdk: flutter
  json_annotation: 4.9.0
  http: 1.3.0
  go_router: ^15.1.1
  intl: ^0.19.0
  flutter_riverpod: ^2.6.1
  freezed_annotation: ^3.0.0
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^5.0.2
  get_it: 8.0.3
  bloc: ^9.0.0
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  build_runner: ^2.4.15
  json_serializable: 6.9.4
  custom_lint: ^0.7.5
  freezed: ^3.0.6
  mockito: ^5.4.4
  bloc_lint: 0.2.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - ./