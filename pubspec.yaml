name: flutter_demo
version: 1.0.0+1
publish_to: none
environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ^3.29.0
description: Flutter techs demonstration app
dependencies:
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_clean_architecture: ^6.0.2
  flutter_dotenv: ^5.0.2
