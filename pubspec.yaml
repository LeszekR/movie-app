name: flutter_demo
description: Flutter techs demonstration app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ^3.29.0

dependencies:
  flutter:
    sdk: flutter
  json_annotation: 4.9.0
  http: 1.3.0
  intl: ^0.19.0
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^5.0.2
  get_it: 8.0.3
  equatable: ^2.0.7
  flutter_clean_architecture: ^6.0.2
  go_router: ^15.1.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  build_runner: ^2.4.15
  json_serializable: 6.9.4
  mockito: ^5.4.4
  custom_lint: ^0.7.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - dotenv