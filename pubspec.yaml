name: flutter_demo
description: Flutter techs demonstration app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ^3.29.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  http: 1.3.0
  intl: ^0.20.2
  flutter_dotenv: ^5.0.2
  get_it: 8.0.3
  equatable: ^2.0.7

dev_dependencies:
  bloc_test: ^10.0.0
  bloc_lint: 0.3.2
  build_runner: ^2.4.15
  json_annotation: 4.9.0
  json_serializable: 6.9.4
  flutter_lints: 5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - dotenv
    - assets/icons/